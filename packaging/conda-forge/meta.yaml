{% set name = "omicau" %}
{% set version = "0.6.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/tunabirgun/omicau/releases/download/v{{ version }}/omicau-{{ version }}.tar.gz
  sha256: 9f1ee9a2f684090a71d00dc7e1e052a12307a1709f2301deb24e73b4c9eae516

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - omicau = omicau.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pandas >=2.2
    - scipy >=1.11
    - scikit-learn >=1.3
    - pytorch >=2.0
    - plotly >=5.18
    - click >=8.1
    - jinja2 >=3.1
    - tqdm >=4.65
    - tomli >=2.0            # TOML-config backport used on Python <3.11 (noarch: kept unconditional)

test:
  imports:
    - omicau
    - omicau.cli
  requires:
    - python {{ python_min }}
  commands:
    - omicau --help
    - omicau check-env

about:
  home: https://github.com/tunabirgun/omicau
  license: MIT
  license_file: LICENSE
  summary: Local multi-omics diagnostics, predictive comparisons and paired layer assessment.
  description: |
    omicau aligns molecular inputs, reports data-quality diagnostics,
    compares predictive models and presents paired layer assessments
    through command-line and local browser workflows.
  doc_url: https://tunabirgun.github.io/omicau/
  dev_url: https://github.com/tunabirgun/omicau

extra:
  recipe-maintainers:
    - tunabirgun
