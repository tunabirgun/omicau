# Optional Conda / mamba environment for a source checkout.
# This is an unpinned convenience specification, not the evaluation lock.
# The solver chooses platform-specific builds; CPU-only PyTorch and the
# absence of CUDA or compiler requirements are not guaranteed here.
# For released installation and study environments, see README.md and
# docs/benchmark-records.md. Run these commands from the repository root.
#
#   conda env create -f environment.yml       # or:  mamba env create -f environment.yml
#   conda activate omicau
#   omicau check-env
#
# To add optional tiers, install the matching extra after activating, e.g.:
#   pip install ".[data]"    # remote data hubs (TCGA, CCLE, Xena, OpenPBTA, Metabolomics, Expression Atlas)
#   pip install ".[ui]"      # local no-code web UI
name: omicau
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.24
  - pandas>=2.2
  - scipy>=1.11
  - scikit-learn>=1.3
  - pytorch>=2.0        # no build variant is pinned
  - plotly>=5.18
  - click>=8.1
  - jinja2>=3.1
  - tqdm>=4.65
  - pip
  - pip:
      - .               # install omicau (and its console entry point) from this directory
