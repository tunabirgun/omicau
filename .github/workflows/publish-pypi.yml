# Validate omicau when the version in pyproject.toml changes on `main`.
# PyPI publication requires an explicit dispatch and uses OIDC; no API token is stored.
#
# A version bump builds validation artifacts on merge. Dispatch this workflow with
# `publish=true` only after the reviewed artifact set is approved. See RELEASING.md.
#
# ONE-TIME SETUP: register this repo as a PyPI trusted publisher (keyed to this
# filename + environment, so never rename this file or add a second publish file):
#   https://pypi.org/manage/account/publishing/  ->  project: omicau,
#   owner: tunabirgun, repo: omicau, workflow: publish-pypi.yml, environment: pypi
name: publish-pypi

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]   # cheap pre-filter; the gate below confirms the version bumped
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated artifacts to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # need HEAD~1 to diff the version against the previous commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          NEW="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          OLD="$(git show HEAD~1:pyproject.toml 2>/dev/null | python -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])" 2>/dev/null || echo none)"
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "version bump: $OLD -> $NEW (validation only)"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "version unchanged ($NEW); nothing to publish"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python packaging/normalize_wheel_metadata.py dist/*.whl --sdist dist/*.tar.gz
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing (no token stored in the repo)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
