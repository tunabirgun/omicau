# Build the desktop app on each OS and attach the installers to a GitHub Release.
# PyInstaller cannot cross-compile, so each artifact is built on its own runner.
name: build-desktop

# Desktop installers are a deliberate, separately-gated release: they run only on
# a published GitHub Release (or manual dispatch), NOT on a plain version tag, so a
# routine PyPI version bump never drags in the code-signing / notarization pipeline.
on:
  workflow_dispatch:
  release:
    types: [published]

# This workflow may build CI artifacts but has no authority to modify GitHub Release assets.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -File packaging/build-windows.ps1
            artifact: dist/omicau
          - os: ubuntu-latest
            script: bash packaging/build-linux.sh
            artifact: dist/omicau-x86_64.AppImage
          - os: macos-14          # Apple Silicon (arm64)
            script: bash packaging/build-macos.sh
            artifact: dist/omicau-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AppImage packaging tool
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage --output /tmp/appimagetool
          sudo install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build
        run: ${{ matrix.script }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Signing secrets are injected only in the release environment.
          OMICAU_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          OMICAU_SIGN_PASS: ${{ secrets.WINDOWS_SIGN_PASS }}
          OMICAU_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          OMICAU_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: omicau-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omicau-${{ matrix.os }}
          path: artifact
      - name: Run frozen Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'artifact/omicau.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Windows executable missing' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke failed' }
          & $exe check-env
          if ($LASTEXITCODE -ne 0) { throw 'environment smoke failed' }
          & $exe bootstrap --dataset mock --out-dir demo
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap smoke failed' }
          & $exe run --config demo/config.json --cores 2
          if ($LASTEXITCODE -ne 0) { throw 'run smoke failed' }
          & $exe verify --config demo/config.json --audit demo/run/audit.json
          if ($LASTEXITCODE -ne 0) { throw 'provenance smoke failed' }
      - name: Run frozen Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          chmod +x artifact/omicau-x86_64.AppImage
          artifact/omicau-x86_64.AppImage --version
          artifact/omicau-x86_64.AppImage check-env
          artifact/omicau-x86_64.AppImage bootstrap --dataset mock --out-dir demo
          artifact/omicau-x86_64.AppImage run --config demo/config.json --cores 2
          artifact/omicau-x86_64.AppImage verify --config demo/config.json --audit demo/run/audit.json
      - name: Run frozen macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/omicau-mount"
          mkdir -p "$mount"
          hdiutil attach artifact/omicau-arm64.dmg -mountpoint "$mount" -nobrowse -quiet
          binary="$(find "$mount" -maxdepth 3 -type f -name omicau -perm -111 -print -quit)"
          test -n "$binary"
          "$binary" --version
          "$binary" check-env
          "$binary" bootstrap --dataset mock --out-dir demo
          "$binary" run --config demo/config.json --cores 2
          "$binary" verify --config demo/config.json --audit demo/run/audit.json
          hdiutil detach "$mount" -quiet
